# 3D COACHING — Configuration Netlify
#
# À chaque envoi dans GitHub, Netlify lance « node build.js » : le site est
# reconstruit à partir de content.json, puis mis en ligne.

[build]
  command = "node build.js"
  publish = "."
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# ---------------------------------------------------------------- sécurité

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# L'espace admin ne doit jamais apparaître dans Google
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# ------------------------------------------------------------ mise en cache

# Les photos et le logo ne changent pas de nom : le navigateur peut les garder
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Les pages et scripts sont revérifiés à chaque visite : une modification
# publiée est visible immédiatement, sans vider le cache
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/content.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------- redirections

# 3dcoaching.business/admin  →  la page de gestion
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 301

# Les fichiers de construction n'ont rien à faire dans le navigateur
[[redirects]]
  from = "/template.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/build.js"
  to = "/"
  status = 301

[[redirects]]
  from = "/netlify/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/outils/*"
  to = "/"
  status = 301
